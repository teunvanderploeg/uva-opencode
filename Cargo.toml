[package]
name = "uva-opencode"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "Local UvA Chat adapter and OpenCode launcher"
publish = false
default-run = "uva-opencode"

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
subtle = "2"
tempfile = "3"
dunce = "1"
os_pipe = { version = "1.2", features = ["io_safety"] }

reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
command-fds = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
