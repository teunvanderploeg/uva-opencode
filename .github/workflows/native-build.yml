# Build and install Rust artifacts without publishing or signing credentials.
name: Rust UvA OpenCode installers
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --test launcher_process --locked -- --ignored --test-threads=1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xvfb
      - if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: cargo xtask native
      - name: Verify local browser session persistence
        shell: bash
        env:
          UVA_BROWSERS_DIR: dist/native/uva-opencode/browsers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --test browser_lifecycle --locked -- --ignored
            xvfb-run -a cargo test --lib --locked -- --ignored --test-threads=1
          else
            cargo test --test browser_lifecycle --locked -- --ignored
            cargo test --lib --locked -- --ignored --test-threads=1
          fi
      - name: Verify macOS installation
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg "$(find dist -maxdepth 1 -name '*.pkg' -print -quit)" -target /
          UVA_STATE_DIR="$RUNNER_TEMP/installed-state" /usr/local/bin/uva-opencode --self-test
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem dist/*-setup.exe
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
          $env:UVA_STATE_DIR = "$env:RUNNER_TEMP/installed-state"
          & "$env:LOCALAPPDATA/Programs/UvAOpenCode/uva-opencode.exe" --self-test
          exit $LASTEXITCODE
      - name: Verify Linux installation
        if: runner.os == 'Linux'
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          export XDG_DATA_HOME="$RUNNER_TEMP/test-data" UVA_STATE_DIR="$RUNNER_TEMP/installed-state"
          "$RUNNER_TEMP/uva-opencode/install.sh"
          "$HOME/.local/bin/uva-opencode" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: uva-opencode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/*-setup.exe
            dist/*.tar.gz
